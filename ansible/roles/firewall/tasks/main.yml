---
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow Open WebUI from LAN
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp

- name: Allow Ollama API from LAN
  community.general.ufw:
    rule: allow
    port: "11434"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
