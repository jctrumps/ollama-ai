---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ ollama_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Verify Docker root directory before AI stack deploy
  ansible.builtin.command: docker info --format '{{ "{{" }} .DockerRootDir {{ "}}" }}'
  changed_when: false
  register: ai_stack_docker_root_dir

- name: Fail if Docker is not using local data-root before AI stack deploy
  ansible.builtin.fail:
    msg: "Docker Root Dir is {{ ai_stack_docker_root_dir.stdout }}, expected {{ docker_data_root }}."
  when:
    - ai_stack_docker_root_dir.stdout != docker_data_root

- name: Create AI data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ollama_data_dir }}"
    - "{{ ollama_data_dir }}/ollama"
    - "{{ ollama_data_dir }}/open-webui"

- name: Copy compose file
  ansible.builtin.copy:
    src: "{{ ollama_compose_src }}"
    dest: "{{ ollama_app_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Copy environment file
  ansible.builtin.copy:
    src: "{{ ollama_env_src }}"
    dest: "{{ ollama_app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Pull current Open WebUI image
  ansible.builtin.command: docker compose --env-file .env -f compose.yml pull open-webui
  args:
    chdir: "{{ ollama_app_dir }}"
  changed_when: true

- name: Pull and start Ollama AI stack
  community.docker.docker_compose_v2:
    project_src: "{{ ollama_app_dir }}"
    files:
      - compose.yml
    state: present
    remove_orphans: true

- name: List installed Ollama models
  ansible.builtin.command: docker exec ollama ollama list
  changed_when: false
  register: installed_ollama_models

- name: Pull initial Ollama models
  ansible.builtin.command: "docker exec ollama ollama pull {{ item }}"
  loop: "{{ ollama_initial_models }}"
  when: item not in installed_ollama_models.stdout
  changed_when: true
